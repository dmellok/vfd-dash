; Raspberry Pi Pico W + EPC-INBN0BV1287UD (GP1287BI 256x50 VFD)
;
; The stock "raspberrypi" platform in the registry does not include Pico W.
; This fork does, via Earle Philhower's arduino-pico core.

[env:pico_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1.0m
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -DMQTT_MAX_PACKET_SIZE=2048

; OTA upload — `pio run -e pico_w_ota -t upload`. Device must already be
; running firmware that includes ArduinoOTA. Password matches OTA_PASSWORD
; in src/net.cpp.
[env:pico_w_ota]
extends = env:pico_w
upload_protocol = espota
upload_port = vfd-dashboard.local
upload_flags =
    --auth=REDACTED_OTA_PASS
